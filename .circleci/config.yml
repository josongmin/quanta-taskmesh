version: 2.1

# Project trigger: only-build-prs (PR open/update/reopen and default-branch
# pushes). Ignore its tag events below. No schedule trigger. Heavy jobs are
# API-only in practice because every parameter defaults to false.
parameters:
  run_fuzz:
    type: boolean
    default: false
  run_load:
    type: boolean
    default: false
  run_benchmark:
    type: boolean
    default: false

executors:
  taskmesh-linux:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    environment:
      CARGO_BUILD_JOBS: "2"
      TASKMESH_BUILD_JOBS: "2"
      TASKMESH_TEST_JOBS: "2"
      CARGO_TERM_COLOR: always
      UV_PYTHON: "3.12.12"
      UV_LOCKED: "1"

commands:
  install-tools:
    steps:
      - run:
          name: Install pinned verification tools
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config libssl-dev protobuf-compiler python3-venv ripgrep
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            fi
            . "$HOME/.cargo/env"
            rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
            rustup toolchain install 1.81.0 --profile minimal
            rustup default 1.99.0
            curl --proto '=https' --tlsv1.2 -LsSf https://get.nexte.st/0.9.104/linux | tar zxf - -C "$HOME/.cargo/bin"
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.58.0 --to "$HOME/.cargo/bin"
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.7/cargo-deny-0.19.7-x86_64-unknown-linux-musl.tar.gz | tar xzf - -C "$HOME/.cargo/bin" --strip-components=1 cargo-deny-0.19.7-x86_64-unknown-linux-musl/cargo-deny
            curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/0.9.11/install.sh | sh
            export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
            uv python install 3.12.12
            uv tool install "semgrep==$(cat tools/semgrep/version.txt)"
            # CircleCI sources BASH_ENV in every child Bash process. Keep a
            # test's PATH shims ahead of real tools after the first step shell.
            printf '%s\n' 'if [[ "${TASKMESH_CI_TOOLS_ON_PATH:-}" != 1 ]]; then' '  export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"' '  export TASKMESH_CI_TOOLS_ON_PATH=1' 'fi' >> "$BASH_ENV"
      - run:
          name: Verify tool and lockfile identity
          command: |
            set -euo pipefail
            [[ "$(rustc --version)" == rustc\ 1.99.0\ * ]]
            [[ "$(cargo nextest --version)" == cargo-nextest\ 0.9.104* ]]
            [[ "$(cargo deny --version)" == cargo-deny\ 0.19.7 ]]
            [[ "$(just --version)" == just\ 1.58.0 ]]
            [[ "$(uv --version)" == uv\ 0.9.11 ]]
            test "$(semgrep --version)" = "$(cat tools/semgrep/version.txt)"
            uv sync --locked
            cargo fetch --locked
            cargo metadata --locked --format-version 1 --no-deps > /dev/null
            cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 --no-deps > /dev/null
            git diff --exit-code -- Cargo.lock fuzz/Cargo.lock uv.lock
            test -n "$(find "$HOME/.cargo/registry" -mindepth 1 -print -quit)"
            test -n "$(find "$HOME/.cache/uv" -mindepth 1 -print -quit)"
  restore-dependencies:
    steps:
      - restore_cache:
          keys:
            - taskmesh-v1-linux-amd64-rust1.99.0-cargo-deps-{{ checksum "Cargo.lock" }}
            - taskmesh-v1-linux-amd64-rust1.99.0-cargo-deps-
      - restore_cache:
          keys:
            - taskmesh-v1-linux-amd64-uv0.9.11-py3.12.12-deps-{{ checksum "uv.lock" }}
            - taskmesh-v1-linux-amd64-uv0.9.11-py3.12.12-deps-
  save-dependencies:
    steps:
      # Fetch/sync above establish nonempty content first. A changed lockfile
      # gets a new immutable key; target artifacts are never cross-lane cached.
      - save_cache:
          key: taskmesh-v1-linux-amd64-rust1.99.0-cargo-deps-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
      - save_cache:
          key: taskmesh-v1-linux-amd64-uv0.9.11-py3.12.12-deps-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

jobs:
  required:
    executor: taskmesh-linux
    environment:
      TASKMESH_CI_EVENT: << pipeline.event.name >>
    steps:
      - checkout
      - run:
          name: Bind exact main or PR merge source
          command: |
            set -euo pipefail
            bash tools/ci/checkout_verified_source.sh
      - restore-dependencies
      - install-tools
      - save-dependencies
      - run:
          name: Required 16-gate verdict
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            source target/ci/source.env
            test "$(git rev-parse HEAD)" = "$TASKMESH_EXPECTED_SHA"
            uv run python tools/gates/run.py --profile ci --require-clean-source --receipt target/verification/circleci-gates.json
            uv run python tools/gates/run.py --validate-receipt target/verification/circleci-gates.json --expected-head "$TASKMESH_EXPECTED_SHA"
            test -s target/verification/circleci-gates.json
      - store_artifacts:
          path: target/verification/circleci-gates.json
          destination: required-16-gate-receipt

  fuzz:
    executor: taskmesh-linux
    steps:
      - checkout
      - restore-dependencies
      - install-tools
      - run:
          name: Pinned nightly fuzz campaign
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            rustup toolchain install nightly-2026-09-21 --profile minimal
            cargo +nightly-2026-09-21 install cargo-fuzz --version 0.13.2 --locked
            TASKMESH_FUZZ_TOOLCHAIN=nightly-2026-09-21 FUZZ_SECONDS=60 just fuzz
      - store_artifacts:
          path: target/sep21/v03/fuzz/local
          destination: fuzz-diagnostic

  load:
    executor: taskmesh-linux
    steps:
      - checkout
      - restore-dependencies
      - install-tools
      - run:
          name: Diagnostic closed-loop host load
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            mkdir -p target/ci-load
            just bench-host-closed-loop tools/bench/scenarios/h1-io-closed-loop-smoke.json target/ci-load/raw.jsonl target/ci-load/topology.json
      - store_artifacts:
          path: target/ci-load
          destination: load-diagnostic

  benchmark:
    executor: taskmesh-linux
    steps:
      - checkout
      - restore-dependencies
      - install-tools
      - run:
          name: Diagnostic Criterion benchmarks
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            just bench
      - store_artifacts:
          path: target/criterion
          destination: criterion-diagnostic

workflows:
  regular:
    unless:
      or:
        - << pipeline.parameters.run_fuzz >>
        - << pipeline.parameters.run_load >>
        - << pipeline.parameters.run_benchmark >>
    jobs:
      - required:
          filters:
            tags:
              ignore: /.*/
  manual-fuzz:
    when: << pipeline.parameters.run_fuzz >>
    jobs:
      - fuzz
  manual-load:
    when: << pipeline.parameters.run_load >>
    jobs:
      - load
  manual-benchmark:
    when: << pipeline.parameters.run_benchmark >>
    jobs:
      - benchmark
