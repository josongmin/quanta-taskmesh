name: bench-gates

# Benchmark regression gates (ADR 9000 / P2 + P8). Separate from `ci.yml` so the
# heavier valgrind run does not block the fast proof matrix.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  alloc-gate:
    name: allocation gate (deterministic, cross-platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # admit→release allocs/op must not exceed the committed baseline.
      - run: bash tools/bench-gate.sh

  instruction-count:
    name: instruction-count gate (iai-callgrind / valgrind)
    runs-on: ubuntu-latest
    env:
      # Fail the bench if any event (instructions, cache, RAM hits) regresses by
      # more than 5% vs the cached baseline. Best-effort: ignored until a baseline
      # exists, so the first run on a fresh cache only records.
      IAI_CALLGRIND_REGRESSION: "Ir=5.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Install iai-callgrind-runner (version must match the crate)
        run: cargo install iai-callgrind-runner --version 0.14.2 --locked

      # Restore/persist the callgrind baseline across runs so regressions are
      # measured against the previous green run, not a cold start.
      #
      # The key is scoped to (os, branch, bench-definition+deps+runner version):
      # a changed bench, a bumped iai-callgrind, or a different branch all start a
      # FRESH baseline instead of comparing against an incomparable one (no
      # false-green from a redefined bench, no false-red from a version bump).
      # restore-keys lets a new branch warm-start from its base branch's baseline.
      - name: Cache iai baseline
        uses: actions/cache@v4
        with:
          path: target/iai
          key: >-
            iai-${{ runner.os }}-${{ github.ref_name }}-${{
              hashFiles('crates/taskmesh-bench/benches/iai_governance.rs',
                        'crates/taskmesh-bench/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            iai-${{ runner.os }}-${{ github.base_ref }}-
            iai-${{ runner.os }}-main-

      - name: Instruction-count benchmark (deterministic, machine-independent)
        run: cargo bench -p taskmesh-bench --features iai --bench iai_governance

  loom:
    name: concurrency model-check (loom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Exhaustively explore admit/release interleavings (ADR 9000 / P6).
      - run: RUSTFLAGS="--cfg loom" cargo test -p taskmesh-engine --test loom_governance --release

  shuttle:
    name: concurrency model-check (shuttle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Randomized schedules over larger thread/op state (ADR 9000 / P6).
      - run: RUSTFLAGS="--cfg shuttle" cargo test -p taskmesh-engine --test shuttle_governance --release

  trend:
    name: wall-clock trend dashboard + flamegraph-on-regress (ADR 9000 / P8)
    runs-on: ubuntu-latest
    permissions:
      contents: write # auto-push the timeseries to gh-pages (main only)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Fresh repos/forks may not have the benchmark history branch yet. Detect
      # that upfront so PRs skip the compare step instead of hard-failing on
      # `git fetch origin gh-pages:gh-pages`.
      - name: Detect benchmark history branch
        id: gh_pages
        run: |
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Emit the libtest "bench" format github-action-benchmark understands.
      - name: Run criterion hot-path benches
        run: |
          cargo bench -p taskmesh-bench --bench admit_release -- --output-format bencher \
            | tee bench-output.txt
          cargo bench -p taskmesh-bench --bench governance_tax -- --output-format bencher \
            | tee -a bench-output.txt

      # Timeseries dashboard (gh-pages) + regression alert. On main it pushes the
      # data point; on PRs it only compares and comments. fail-on-alert trips the
      # flamegraph step below.
      - name: Store + alert on regression
        if: steps.gh_pages.outputs.exists == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: taskmesh wall-clock
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true

      - name: Skip trend compare until gh-pages exists
        if: steps.gh_pages.outputs.exists != 'true'
        run: |
          echo "Skipping trend compare: origin/gh-pages does not exist yet."

      # On a detected regression, capture a flamegraph + hardware counters for
      # EVERY bench that feeds the alert (admit_release AND governance_tax), so the
      # evidence always covers whichever one regressed — not just one of them
      # (ADR 9000 / P8).
      - name: Flamegraph + perf counters on regression
        if: failure()
        run: |
          sudo apt-get update && sudo apt-get install -y linux-tools-common linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
          cargo install flamegraph --locked || true
          for b in admit_release governance_tax; do
            cargo flamegraph --bench "$b" -p taskmesh-bench -o "flamegraph-$b.svg" -- --bench || true
            perf stat -e instructions,cache-misses,branch-misses \
              cargo bench -p taskmesh-bench --bench "$b" -- --bench 2> "perf-stat-$b.txt" || true
          done
      - name: Upload regression profile
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-profile
          path: |
            flamegraph-*.svg
            perf-stat-*.txt
          if-no-files-found: ignore
