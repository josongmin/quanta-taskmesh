name: bench-gates

# Disabled hosted compatibility workflow. Ordinary benchmark verification runs
# through local `just verify-local` / `just qualify-local`; push, pull-request
# and schedule events are forbidden. The repository workflow is disabled in
# GitHub settings and retained only as reproducible historical infrastructure.
#
# Every shell step runs under `bash` with `pipefail` (via `defaults.run.shell`),
# so a benchmark that fails behind a `tee` fails the step (TM16-019).

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  instruction-count:
    name: instruction-count gate (iai-callgrind / valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-21
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Install iai-callgrind-runner (version from tools/bench/perf-gate.json)
        run: |
          version="$(python3 -c 'import json; print(json.load(open("tools/bench/perf-gate.json"))["instruction_count_gate"]["iai_callgrind_runner"])')"
          cargo install iai-callgrind-runner --version "${version}" --locked

      # The baseline cache key is the SAME fingerprint tools/bench-iai.sh
      # compares the cached stamp against: bench definition, dependency graph,
      # gate config, toolchain, valgrind, runner. Computed by the script itself
      # (after the tools it hashes are installed) so the key and the stamp can
      # never disagree — a key built from a subset of the inputs is how a
      # toolchain bump turned every later run into BASELINE_CREATED forever
      # (the entry was immutable and its stamp never matched again).
      #
      # No ref in the key: an explicitly dispatched run can reuse a compatible
      # baseline. A changed measured definition gets a fresh key and
      # BASELINE_CREATED, which is not a regression-qualified result.
      - name: Compute baseline fingerprint
        id: fingerprint
        run: |
          # Assigned first so a failing script fails the step here, with its own
          # diagnostic, instead of keying the cache on an empty value.
          value="$(bash tools/bench-iai.sh fingerprint)"
          [[ -n "${value}" ]] || { echo "::error::empty fingerprint"; exit 1; }
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Cache iai baseline
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/iai
          key: iai-v3-${{ runner.os }}-${{ steps.fingerprint.outputs.value }}

      - name: Instruction-count benchmark (thresholds from tools/bench/perf-gate.json)
        id: iai
        run: just bench-iai

      # The verdict is explicit. QUALIFIED is the only regression-qualified
      # outcome. BASELINE_CREATED is allowed — it is the first run for this
      # fingerprint — but is explicitly not called regression-qualified.
      # Anything else fails the job.
      - name: Report qualification status
        env:
          STATUS: ${{ steps.iai.outputs.status }}
          FINGERPRINT: ${{ steps.iai.outputs.fingerprint }}
          EXPECTED_FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: |
          {
            echo "## instruction-count gate"
            echo "status: **${STATUS}**"
            echo "fingerprint: \`${FINGERPRINT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${FINGERPRINT}" != "${EXPECTED_FINGERPRINT}" ]]; then
            echo "::error::the fingerprint the gate ran under (${FINGERPRINT}) is not the one the cache was keyed on (${EXPECTED_FINGERPRINT})"
            exit 1
          fi
          case "${STATUS}" in
            QUALIFIED)
              echo "regression-qualified against a compatible baseline" >> "$GITHUB_STEP_SUMMARY"
              ;;
            BASELINE_CREATED)
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "This run recorded a baseline; it is **not** a regression-qualified pass. The next run with the same fingerprint qualifies against it." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::instruction-count gate reported status '${STATUS}'"
              exit 1
              ;;
          esac

      - name: Upload raw IAI and manifest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iai-evidence
          path: target/iai
          if-no-files-found: warn
