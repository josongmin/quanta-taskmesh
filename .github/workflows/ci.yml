name: release (ci + nightly)

# Disabled hosted compatibility workflow. Ordinary verification runs locally
# through `just dev` / `just verify-macos-ci`; this manual fallback
# runs final release proof including the nightly mutation campaigns. Push, pull-request and
# schedule events are forbidden. The repository workflow is disabled in GitHub
# settings and retained only as reproducible historical infrastructure.

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fast gate (just gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Release-policy tests resolve the immutable 0.2.0 baseline commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-21
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-deny@0.19.7,cargo-nextest@0.9.104
      - name: Install semgrep
        run: uv tool install "semgrep==$(cat tools/semgrep/version.txt)"

      # The canonical fast gate, exactly as `just gate` defines it. Each recipe
      # is invoked on its own line so a failure names the gate that failed.
      - run: just fmt-check
      - run: just clippy
      - run: just test
      - run: just deny
      - run: just semgrep
      - run: just test-architecture
      - run: just py-lint
      - run: just py-test
      - run: just bench-gate
      - run: just gates-inventory
      - run: just fuzz-check

  proof-matrix:
    name: feature / doc / bench-smoke matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-21
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-nextest@0.9.104

      # Feature-matrix drift: the `rayon` feature auto-wires the default CPU
      # executor on a cfg-gated path that default-feature CI never compiles.
      - run: just test-rayon
      - run: just doctest
      - run: just rustdoc
      # Benches must keep compiling and smoke-running.
      - run: just bench-smoke

  mutation-gate:
    name: curated mutation campaign
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-21
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      # Reintroduce each fixed defect and require its named regression to fail.
      # The producer snapshots the current clean CI source into an isolated campaign.
      - run: just mutants-critical
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-curated-evidence
          path: target/sep21/v02/curated

  mutation-generated:
    name: generated workspace mutation campaign
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-21
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-mutants,cargo-nextest@0.9.104
      # A distinct full-workspace denominator; curated outcomes cannot satisfy it.
      - run: just mutants-generated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-generated-evidence
          path: target/sep21/v02/generated

  tsan:
    name: ThreadSanitizer (just tsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # `stable` is what `just tsan` reads the host triple from; nightly with
      # rust-src is what it builds with (-Zbuild-std instruments std as well).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-21
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly 2026-09-21
        with:
          components: rust-src
      - run: rustup default stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      # TSan on recent kernels can abort with "unexpected memory mapping" under
      # 32-bit mmap randomisation; 28 bits is the documented workaround.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: just tsan

  fuzz:
    name: libFuzzer campaign (just fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-21
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly 2026-09-21
      - run: rustup default stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            .
            fuzz
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-fuzz
      # 60 s per target in a manually dispatched hosted run (30 s locally).
      # A crash uploads its reproducer.
      - run: FUZZ_SECONDS=60 just fuzz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-artifacts
          path: |
            target/sep21/v03/fuzz/local
            fuzz/artifacts

  coverage:
    name: coverage report (just coverage-report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-21
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-llvm-cov
      - run: just coverage-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            target/coverage/summary.json
            target/coverage/lcov.info

  # The receipt of record (H16-022). Producer-heavy gates run in prerequisite
  # jobs and their exact-SHA envelopes are imported here; the remaining gates
  # run under one bounded collector deadline. This job always runs so a failed
  # or missing producer becomes a durable NOT_QUALIFIED receipt, not a skipped
  # check with no evidence.
  qualification:
    name: qualification receipt (isolated hosted checkout)
    needs: [mutation-gate, mutation-generated, fuzz, modelcheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The collector reruns release-policy tests that resolve the immutable
          # 0.2.0 baseline. A shallow checkout makes that proof fail by topology,
          # not because the release policy is invalid.
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: mutation-curated-evidence
          path: target/sep21/v02/curated
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: mutation-generated-evidence
          path: target/sep21/v02/generated
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: fuzz-artifacts
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: modelcheck-evidence
          path: target/modelcheck
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-21
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly 2026-09-21
        with:
          components: rust-src
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-21
        with:
          toolchain: "1.81.0"
      - run: rustup default stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: cargo-deny@0.19.7,cargo-llvm-cov,cargo-fuzz,cargo-mutants,cargo-nextest@0.9.104
      - name: Install semgrep
        run: uv tool install "semgrep==$(cat tools/semgrep/version.txt)"
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Install iai-callgrind-runner (version from tools/bench/perf-gate.json)
        run: |
          version="$(python3 tools/bench/iai_gate.py config iai_callgrind_runner)"
          cargo install iai-callgrind-runner --version "${version}" --locked
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Restore iai baseline (same key as bench.yml)
        id: fingerprint
        run: |
          value="$(bash tools/bench-iai.sh fingerprint)"
          [[ -n "${value}" ]] || { echo "::error::empty fingerprint"; exit 1; }
          echo "value=${value}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/iai
          key: iai-v6-${{ runner.os }}-${{ steps.fingerprint.outputs.value }}
      # Baseline python3 keeps a failed optional tool install from suppressing
      # the NOT_QUALIFIED receipt. Checkout/runner failure is irreducible here:
      # without receipt.py on disk no in-repository collector can execute.
      - name: Collect the receipt
        if: always()
        env:
          TASKMESH_PRODUCER_NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python3 tools/qualification/receipt.py collect --hosted-ci
          --consume-producers --out receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualification-receipt
          path: |
            receipt.json
            receipt.gates.json
            receipt.mutations.json
            receipt.generated-mutations.json
            receipt.producers.json
            target/sep21/v02/curated
            target/sep21/v02/generated
            target/sep21/v03/fuzz/local
            target/modelcheck
            target/iai/baseline-manifest.json
            target/iai/comparison-manifest.json
            target/iai/benchmark-output.log
            target/coverage/summary.json
            target/coverage/lcov.info

  modelcheck:
    name: bounded model evidence (Loom + Shuttle + replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-21
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: just modelcheck
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: modelcheck-evidence
          path: target/modelcheck

  consumer-msrv:
    name: consumer MSRV (declared rust-version, outside the workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-21
        with:
          toolchain: "1.81.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - run: just consumer-msrv
