name: ci

# Every job runs the SAME recipes a developer runs locally (`just <recipe>`).
# There is one definition of each gate — the Justfile — and this file only
# decides which of them run where. A gate that exists only here, or only there,
# is a gate the other side cannot see (TM16-006). tools/gates/inventory.json
# lists every gate with its required-ness; tools/gates/validate_inventory.py
# checks that this workflow, the Justfile, and the inventory agree.

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fast gate (just gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Install semgrep
        run: uv tool install semgrep

      # The canonical fast gate, exactly as `just gate` defines it. Each recipe
      # is invoked on its own line so a failure names the gate that failed.
      - run: just fmt-check
      - run: just clippy
      - run: just test
      - run: just deny
      - run: just semgrep
      - run: just test-architecture
      - run: just py-lint
      - run: just py-test
      - run: just pm-lint
      - run: just bench-gate
      - run: just gates-inventory
      - run: just fuzz-check

  proof-matrix:
    name: feature / doc / bench-smoke matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2

      # Feature-matrix drift: the `rayon` feature auto-wires the default CPU
      # executor on a cfg-gated path that default-feature CI never compiles.
      - run: just test-rayon
      - run: just doctest
      - run: just rustdoc
      # Benches must keep compiling and smoke-running.
      - run: just bench-smoke

  mutation-gate:
    name: mutation gate (just mutants-critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5
      # Reintroduce each fixed defect and require its named regression to fail.
      # A dirty checkout would make the score meaningless; CI refuses one.
      - run: just mutants-critical --require-clean

  tsan:
    name: ThreadSanitizer (just tsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `stable` is what `just tsan` reads the host triple from; nightly with
      # rust-src is what it builds with (-Zbuild-std instruments std as well).
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # TSan on recent kernels can abort with "unexpected memory mapping" under
      # 32-bit mmap randomisation; 28 bits is the documented workaround.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: just tsan

  fuzz:
    name: libFuzzer campaign (just fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # 60 s per target in CI (30 s locally): long enough for libFuzzer to
      # reach the engine's branches from an empty corpus, short enough to run
      # on every push. A crash uploads its reproducer.
      - run: FUZZ_SECONDS=60 just fuzz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  coverage:
    name: coverage report (just coverage-report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: just coverage-report
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/coverage/summary.json
            target/coverage/lcov.info

  # The receipt of record (H16-022). Everything above also runs here, once
  # more, through tools/qualification/receipt.py on a clean checkout — that is
  # the only place a QUALIFIED verdict is issued (the collector verifies the
  # Actions workspace and GITHUB_SHA, and the validator re-derives
  # source identity; the gate results are this job's attestation). Uploaded as
  # an artifact; the job fails unless the verdict is QUALIFIED, so a required
  # gate that could not run here (a missing tool) is red, not silently NOT_RUN.
  qualification:
    name: qualification receipt (isolated hosted checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov,cargo-fuzz
      - name: Install semgrep
        run: uv tool install semgrep
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Install iai-callgrind-runner (version from tools/bench/perf-gate.json)
        run: |
          version="$(python3 tools/bench/iai_gate.py config iai_callgrind_runner)"
          cargo install iai-callgrind-runner --version "${version}" --locked
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Restore iai baseline (same key as bench.yml)
        id: fingerprint
        run: |
          value="$(bash tools/bench-iai.sh fingerprint)"
          [[ -n "${value}" ]] || { echo "::error::empty fingerprint"; exit 1; }
          echo "value=${value}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: target/iai
          key: iai-v3-${{ runner.os }}-${{ steps.fingerprint.outputs.value }}
      - name: Collect the receipt
        run: uv run python tools/qualification/receipt.py collect --hosted-ci --out receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-receipt
          path: |
            receipt.json
            receipt.gates.json
            receipt.mutations.json

  loom:
    name: concurrency model-check (loom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just loom

  shuttle:
    name: concurrency model-check (shuttle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just shuttle

  consumer-msrv:
    name: consumer MSRV (declared rust-version, outside the workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just consumer-msrv
