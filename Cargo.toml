[workspace]
members = [
    "crates/taskmesh-contract",
    "crates/taskmesh-engine",
    "crates/taskmesh",
    "crates/taskmesh-rayon",
    "crates/taskmesh-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Floor set by the `#[allow(..., reason = "...")]` lint-reason syntax (Rust 1.81).
rust-version = "1.81"
license = "MIT OR Apache-2.0"
authors = ["Song Min"]

[workspace.dependencies]
taskmesh-contract = { version = "0.1.0", path = "crates/taskmesh-contract" }
taskmesh-engine = { version = "0.1.0", path = "crates/taskmesh-engine" }
taskmesh-rayon = { version = "0.1.0", path = "crates/taskmesh-rayon" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
proptest = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
rayon = "1"

# Benchmark-only dependencies (isolated to taskmesh-bench / dev-deps).
criterion = { version = "0.5", features = ["html_reports"] }
hdrhistogram = "7"
rand = "0.8"
rand_distr = "0.4"
