[package]
name = "taskmesh-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Governance core for taskmesh: admission, fairness, memory, composite, inventory."

[dependencies]
taskmesh-contract = { workspace = true }
parking_lot = { workspace = true }

[features]
# Exposes `Governor::new_unchecked` — the *unvalidated* constructor. Off by
# default so the public surface only offers the fail-closed `Governor::new`; a
# direct embedder (via `taskmesh::ext`) cannot accidentally boot a contradictory
# policy. Enabled for this crate's own tests/benches via the self dev-dependency
# below, and by `taskmesh-bench`.
test-util = []
# Model-check builds (`just loom` / `just shuttle`): the checker's primitives
# replace the production mutex and atomics inside `src/sync.rs`. Each feature
# must be paired with the matching `--cfg`; the seam refuses one without the
# other. Optional so a downstream consumer's lockfile never resolves the
# checkers' dependency trees (the consumer-MSRV check builds on Rust 1.81).
loom = ["dep:loom"]
shuttle = ["dep:shuttle"]

[lints.rust]
# `loom`/`shuttle` are deliberate model-check cfgs, set via RUSTFLAGS.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(shuttle)'] }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
# Self dev-dependency: enables `test-util` for this crate's own integration
# tests, doctests, and benches (which legitimately exercise raw, possibly
# invalid, scheduler configs) without leaking the unvalidated constructor into
# the default public surface seen by downstream embedders.
taskmesh-engine = { path = ".", features = ["test-util"] }

# Concurrency model-checking (ADR 9000 / P6, ADR 0003 D-loom). Compiled only
# under the matching `--cfg` *and* feature; normal builds never pull these in.
# They are *regular* (not dev-) dependencies because `src/sync.rs` builds the
# governor itself on the checker's mutex and atomics — the model tests in
# `tests/` exercise the real `Governor`, not a replica of its locking design.
# loom = exhaustive (small state); shuttle = randomized (larger state).
[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", optional = true }

[target.'cfg(shuttle)'.dependencies]
shuttle = { version = "0.7", optional = true }

# Model-check targets are discovered only with their checker feature. The
# synchronization seam also requires the matching --cfg, so a half-configured
# checker build fails rather than reporting an empty passing test binary.
[[test]]
name = "loom_governance"
path = "tests/loom_governance.rs"
required-features = ["loom"]

[[test]]
name = "shuttle_governance"
path = "tests/shuttle_governance.rs"
required-features = ["shuttle"]

[[test]]
name = "model_replay_fixture"
path = "tests/model_replay_fixture.rs"
required-features = ["shuttle"]
