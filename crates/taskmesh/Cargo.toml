[package]
name = "taskmesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Governed execution control-plane: Tokio host facade for taskmesh."

[dependencies]
taskmesh-contract = { workspace = true }
taskmesh-engine = { workspace = true }
taskmesh-rayon = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }

[features]
default = []
rayon = ["dep:taskmesh-rayon"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
taskmesh-rayon = { workspace = true }
