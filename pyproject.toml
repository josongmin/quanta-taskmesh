[project]
name = "taskmesh-tools"
version = "0.1.0"
description = "Managed Python repo-tooling for taskmesh (tools/pm, tools/arch, tools/semgrep)."
requires-python = ">=3.9"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "jinja2>=3", "pyyaml>=6"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tools"]
