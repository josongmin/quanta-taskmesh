[project]
name = "taskmesh-tools"
version = "0.1.0"
description = "Managed Python verification tooling for taskmesh."
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pyyaml>=6",
    "tomli>=2; python_version < '3.11'",
    "psutil>=7.2.2,<8",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tools"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "slow: runs a real cargo producer (seconds, not milliseconds)",
    "qualification: validates release or platform-specific qualification tooling",
]
