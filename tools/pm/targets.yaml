# Prompt-manager targets for the taskmesh repository.
#
# Deliberately empty (see tools/pm/README.md, "What PM owns here"):
#
# - AGENTS.md is hand-authored by the repository owner and is NOT generated.
#   It is the one instruction file this repo actually uses, and its content
#   (fail-closed, capability-pool topology, product-neutral APIs) is specific to
#   taskmesh. Regenerating it from templates would overwrite that policy.
# - The sources this tool previously rendered described a different project
#   entirely (a log-search take-home). They were removed rather than rendered
#   into CLAUDE.md / .codex/* / .cursorrules, which would have installed wrong
#   instructions for every agent working in this repository.
#
# Adding a target here is how the owner opts a generated file in. The tool,
# its manifest validation, and its render plan are exercised by
# tools/pm/tests/ against hermetic fixtures regardless.
targets: {}
